# Format, lint and tests, the same as `make lint` and `make test` (in the
# cos-dev Docker image), plus the install scripts and the npm installer,
# and `install.sh --app` on macOS. The desktop app (clients/desktop) isn't
# built here; release.yml builds it.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cargo fmt --check and clippy
        run: make lint
      - name: cargo test
        run: make test

  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: make shellcheck
      - name: npm installer tests
        run: make npm-test

  app-installer:
    name: install.sh --app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: install.sh --app against a fake release
        run: make app-install-test
