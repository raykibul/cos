[package]
name = "cos-harness"
description = "Drives coding agents (Claude Code today, Codex later) as child processes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
vt100.workspace = true

# Stand-in for the `claude` binary, used by the integration tests so they
# don't spend tokens or need a login.
[[bin]]
name = "cos-fake-claude"
path = "src/bin/cos-fake-claude/main.rs"
test = false

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
