[package]
name = "cos-desktop"
description = "The cos desktop app: a Tauri shell around the daemon bridge."
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Its own workspace, so the repo's workspace (and Docker) never builds it.
# It is built natively with `cargo tauri build`.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cos-bridge = { path = "../../../crates/cos-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
