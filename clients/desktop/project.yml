# Generate the Xcode project with `xcodegen generate` (see README.md).
name: Cos
options:
  bundleIdPrefix: local.cos
  deploymentTarget:
    macOS: "14.0"
packages:
  CosKit:
    path: ../shared/CosKit
  # The terminal emulator for agents' live terminals. Pinned exactly: 1.11.2
  # is the last release before SwiftTerm added a Metal renderer (1.12), whose
  # shaders need Xcode's separately downloaded Metal toolchain to build.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.11.2
targets:
  Cos:
    type: application
    platform: macOS
    sources: [Cos]
    dependencies:
      - package: CosKit
      - package: SwiftTerm
        product: SwiftTerm
    info:
      path: Cos/Info.plist
      properties:
        CFBundleDisplayName: cos
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_NAME: cos
        PRODUCT_BUNDLE_IDENTIFIER: local.cos.app
        SWIFT_VERSION: "6.0"
        # Ad-hoc signing is enough to run locally. No App Sandbox: the app
        # has to reach the daemon's socket in ~/.cos.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
  # Renders the app's views to PNGs against an in-process fake daemon, for
  # checking layout without a real daemon or a screen. See README.md.
  CosSnapshots:
    type: tool
    platform: macOS
    sources:
      - path: Cos
        excludes: [CosApp.swift, Info.plist]
      - path: Snapshots
    dependencies:
      - package: CosKit
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Cos:
    build:
      targets:
        Cos: all
    test:
      targets:
        - package: CosKit/CosKitTests
  CosSnapshots:
    build:
      targets:
        CosSnapshots: all
